# Application base configuration - defaults to local dev (uses H2 in-memory database)
# Override per environment: application-dev.properties, application-prod.properties

spring.application.name=webauthn-infrastructure

# -- Database --------------------------------------------------------------------
# Active profile "prod" must supply a real datasource URL
spring.datasource.url=jdbc:h2:mem:webauthndb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 console (dev only - disable in prod)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -- Security ------------------------------------------------------------------
spring.security.user.name=admin
spring.security.user.password=changeme

# -- Actuator ------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=health
management.endpoints.web.path-mapping.info=info
management.endpoints.web.path-mapping.loggers=_ops/loggers
management.endpoints.web.path-mapping.metrics=_ops/metrics
management.endpoint.env.show-details=when-authorized
management.info.env.enabled=true

# -- OpenAPI / Swagger ---------------------------------------------------------
# Bump this whenever the API contract changes (controllers/request-response models)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
app.api.title=webauthn-infrastructure
app.api.version=1.0.0

# -- WebAuthn Relying Party ----------------------------------------------------
# Set webauthn.relying.party.id to the effective domain of the web origin
# (no scheme or port). See https://www.w3.org/TR/webauthn-2/#rp-id
webauthn.relying.party.id=localhost
webauthn.relying.party.name=webauthn-infrastructure
webauthn.relying.party.origins=http://localhost:8080

# -- JWT -----------------------------------------------------------------------
# HMAC-256 secret used to verify incoming Bearer tokens.
# Replace with a long random string in production; source from an env variable or secret manager.
jwt.secret=changeme-replace-with-a-long-random-string-in-production

# -- Request ID ---------------------------------------------------------------
# Salt used when hashing the UUID -> requestId (SHA-256).
# Change per deployment; must be the same value for the lifetime of a challenge.
request.id.hash.salt=changeme-salt
