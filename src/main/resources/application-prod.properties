# Production profile overrides
# Source sensitive values from env vars or a secrets manager — never commit real values

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false

# ── WebAuthn ──────────────────────────────────────────────────────────────────
webauthn.relying.party.id=${RP_ID}
webauthn.relying.party.name=${RP_NAME}
webauthn.relying.party.origins=${RP_ORIGINS}

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}

# ── Request ID ───────────────────────────────────────────────────────────────
request.id.hash.salt=${REQUEST_ID_SALT}
